name: Regen profile cards

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate.py"
      - ".github/workflows/regen.yml"
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC daily — after the contribution day rolls over

concurrency:
  group: regen-profile
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (pixel portrait)
        run: python -m pip install --no-cache-dir pillow

      - name: Generate cards from live GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python generate.py

      - name: Commit regenerated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate profile cards [skip ci]"
            git push
          fi
